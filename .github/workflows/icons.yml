name: icons
on:
  push:
    branches:
      - develop
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  icons:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: refresh
        run: |
          cd assets
          rm -rf bootstrap-icons
          mkdir bootstrap-icons
          curl -sSfL https://raw.githubusercontent.com/twbs/icons/refs/heads/main/LICENSE -o bootstrap-icons/LICENSE
          for icon in $(jq -r .[] bootstrap-icons.json); do
            curl -sSfL https://raw.githubusercontent.com/twbs/icons/refs/heads/main/icons/"$icon".svg -o bootstrap-icons/"$icon".svg
          done
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          signoff: true
          delete-branch: true
          commit-message: icons
          branch: icons
          title: icons
          body: icons
