name: icons
on:
  push:
    branches:
      - develop
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  icons:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: refresh
        run: |
          cd assets
          rm -rf bootstrap-icons
          mkdir bootstrap-icons
          curl -sSfL https://raw.githubusercontent.com/twbs/icons/refs/heads/main/LICENSE -o bootstrap-icons/LICENSE
          for icon in $(jq -r .[] bootstrap-icons.json); do
            curl -sSfL https://raw.githubusercontent.com/twbs/icons/refs/heads/main/icons/"$icon".svg -o bootstrap-icons/"$icon".svg
          done
      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          signoff: true
          delete-branch: true
          commit-message: icons
          branch: icons
          title: icons
          body: icons
