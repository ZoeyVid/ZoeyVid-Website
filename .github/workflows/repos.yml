name: repos
on:
  push:
    branches:
      - develop
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  repos:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: refresh
        run: |
          cd assets
          rm -rf repos
          mkdir -p repos
          repos=$(curl -sSfL "https://api.github.com/orgs/ZoeyVid/repos?per_page=100" --header "authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | jq '[ .[] | select(.archived==false and .private==false and .name != ".github") ] | sort_by(.name)')
          for repo in $(jq -r '.[].name' <<< "$repos"); do
            branch=$(jq -r --arg r "$repo" 'first(.[] | select(.name==$r).default_branch)' <<< "$repos")
            echo -e "<meta charset=\"utf-8\">\n$(curl -sSfL -X POST https://api.github.com/markdown/raw --header "authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" --header "Content-Type: text/plain" -d "$(curl -sSfL https://raw.githubusercontent.com/ZoeyVid/$repo/$branch/README.md)")\n" | tee "repos/$repo.html"
          done
          jq 'map({ (.name): { name, html_url, fork, description: (.description // ""), license: (.license.spdx_id // "") } }) | add' <<< "$repos" | tee repos/index.json
      - name: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -sm "update repos"
          git push
